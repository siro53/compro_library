name: verify

on:
  pull_request:
  push:
    branches: main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        pip3 install -r .verify-helper/requirements.txt
        python3 .verify-helper/patch_dependencies.py

    - name: Check verifier compatibility fixes
      run: python3 -m unittest discover -s test/mytest/ci -v

    - name: Run bundle snapshot tests
      run: python3 -m unittest discover -s test/mytest/bundle -v

    - name: Check standalone headers and linkage
      run: python3 -m unittest discover -s test/mytest/headers -v


    # # required only if you want to verify Haskell code
    # - name: Install dependencies (Haskell)
    #   uses: actions/setup-haskell@v1

    # # required only if you want to verify Java code
    # - name: Install dependencies (Java)
    #   uses: actions/setup-java@v1
