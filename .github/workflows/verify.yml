    # # required only if you want to verify Nim code
    # - name: Install dependencies (Nim)
    #   run: sudo apt install nim

    # - name: Set up Rust (1.42.0)
    #   uses: actions-rs/toolchain@v1
    #   with:
    #     toolchain: 1.42.0-x86_64-unknown-linux-gnu
    #     default: true
    #     profile: minimal

    # # required by cargo-udeps
    # - name: Set up Rust (nightly)
    #   uses: actions-rs/toolchain@v1
    #   with:
    #     toolchain: nightly-x86_64-unknown-linux-gnu
    #     default: true
    #     profile: minimal

    # # required only if you set `languages.rust.list_dependencies_backend.kind` to `"cargo-udeps"`
    # - name: Install cargo-udeps for Rust
    #   uses: actions-rs/install@v0.1
    #   with:
    #     crate: cargo-udeps
    #     use-tool-cache: true

    - name: Run tests
      id: verification
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        YUKICODER_TOKEN: ${{ secrets.YUKICODER_TOKEN }}
        DROPBOX_TOKEN: ${{ secrets.DROPBOX_TOKEN }}
      run: oj-verify run

    # Generate even after failed tests, so the published verification status stays current.
    # Unset GITHUB_TOKEN to disable oj-verify's automatic gh-pages replacement.
    - name: Generate documentation
      id: docs
      if: ${{ !cancelled() && github.event_name == 'push' && steps.verification.outcome != 'skipped' }}
      run: env -u GITHUB_TOKEN oj-verify docs

    - name: Publish documentation
      if: ${{ !cancelled() && github.event_name == 'push' && steps.verification.outcome != 'skipped' && steps.docs.outcome == 'success' }}
      uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
      with:
        token: ${{ secrets.GH_PAT }}
        branch: gh-pages
        folder: .verify-helper/markdown
        clean-exclude: pr-preview/
        force: false

  preview:
    name: Pages preview
    needs: verify
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: pages-preview-${{ github.event.number }}
      cancel-in-progress: false
    # Fork PRs do not have access to the deployment secret.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Generate documentation
        run: |
          pip3 install -r .verify-helper/requirements.txt
          python3 .verify-helper/patch_dependencies.py
          env -u GITHUB_TOKEN oj-verify docs

      - name: Configure preview URLs
        env:
          PREVIEW_BASEURL: /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io
        run: |
          printf '\nbaseurl: "%s"\nurl: "%s"\n' "$PREVIEW_BASEURL" "$PAGES_URL" >> .verify-helper/markdown/_config.yml

      - name: Build preview HTML
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: .verify-helper/markdown
          destination: _site

      # Verification can finish after the PR was closed or updated.
      - name: Check that this preview is still current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pr_status=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,headRefOid --jq '.state + " " + .headRefOid')
          if [ "$pr_status" = "OPEN $EXPECTED_HEAD" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy preview
        if: steps.current.outputs.deploy == 'true'
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1
        with:
          # A PAT is needed to trigger the branch-based GitHub Pages build.
          token: ${{ secrets.GH_PAT }}
          action: deploy
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          qr-code: false
