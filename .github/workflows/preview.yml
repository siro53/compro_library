name: Remove Pages preview

on:
  pull_request:
    types: [closed]

concurrency:
  group: pages-preview-${{ github.event.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  remove-preview:
    # Cleanup must run even if verification failed or is still running.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Remove preview
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1
        with:
          token: ${{ secrets.GH_PAT }}
          action: remove
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          qr-code: false
